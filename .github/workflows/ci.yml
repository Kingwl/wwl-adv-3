name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_RELEASE: 4.6.3-stable

jobs:
  scaffold:
    name: Scaffold checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Run scaffold checks
        working-directory: game
        run: ./tools/check-all.sh

  godot:
    name: Godot headless tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail

          godot_dir="${RUNNER_TEMP}/godot"
          godot_bin="${godot_dir}/Godot_v${GODOT_RELEASE}_linux.x86_64"

          mkdir -p "${godot_dir}"
          curl -L \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" \
            -o "${RUNNER_TEMP}/godot.zip"
          unzip -q "${RUNNER_TEMP}/godot.zip" -d "${godot_dir}"
          chmod +x "${godot_bin}"

          echo "GODOT_BIN=${godot_bin}" >> "${GITHUB_ENV}"
          "${godot_bin}" --version

      - name: Run Godot tests
        working-directory: game
        run: ./tools/test-godot.sh
